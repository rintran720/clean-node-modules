[package]
name = "clean-node-modules"
version = "0.1.0"
edition = "2021"

[lib]
name = "clean_node_modules_lib"
path = "src/lib.rs"

[[bin]]
name = "clean-node-modules"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
trash = "5"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
