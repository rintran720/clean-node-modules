<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clean Node Modules</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header id="topbar">
      <h1>Clean Node Modules</h1>
      <div id="status"></div>
      <button id="new-scan-btn">New scan…</button>
      <button id="cancel-btn" hidden>Cancel</button>
    </header>

    <section id="empty-state">
      <p>Choose a folder to scan for <code>node_modules</code> directories.</p>
      <button id="choose-btn">Choose folder…</button>
    </section>

    <section id="results" hidden>
      <table id="results-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all" /></th>
            <th data-sort="path">Project</th>
            <th data-sort="size">Size</th>
            <th data-sort="project_modified">Project modified</th>
            <th data-sort="nm_modified">node_modules modified</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </section>

    <section id="delete-progress" hidden>
      <div class="dp-row">
        <progress id="delete-progress-bar" value="0" max="1"></progress>
        <span id="delete-progress-count">0 / 0</span>
      </div>
      <div id="delete-progress-path"></div>
    </section>

    <footer id="footer" hidden>
      <span id="selection-summary">0 selected · 0 B</span>
      <button id="delete-btn" disabled>Move to Trash</button>
      <button id="delete-permanent-btn" class="danger" disabled>Delete permanently…</button>
    </footer>
  </main>

  <dialog id="confirm-modal">
    <form method="dialog">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-summary"></p>
      <p id="confirm-warning" class="warn" hidden></p>
      <label id="confirm-type-label" hidden>Type <code>DELETE</code> to confirm:
        <input id="confirm-type-input" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <div class="actions">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="submit" id="confirm-ok" value="ok">Confirm</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="main.js"></script>
</body>
</html>
